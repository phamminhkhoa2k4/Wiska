<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:a="http://xmlns.jcp.org/jsf/passthrough"  xmlns:f="http://xmlns.jcp.org/jsf/core"  
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <h:head>
        <meta charset="utf-8" />
        <link
            rel="apple-touch-icon"
            sizes="76x76"
            href="assets/img/apple-icon.png"
            />
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="assets/img/favicon.png"
            />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

        <title>Wiska</title>

        <meta
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
            name="viewport"
            />
        <meta name="viewport" content="width=device-width" />

        <!-- Bootstrap core CSS     -->
        <link href="assets/css/bootstrap.min.css" rel="stylesheet" />

        <!-- Animation library for notifications   -->
        <link href="assets/css/animate.min.css" rel="stylesheet" />

        <!--  Paper Dashboard core CSS    -->
        <link href="assets/css/paper-dashboard.css" rel="stylesheet" />

        <!--  CSS for Demo Purpose, don't include it in your project     -->
        <link href="assets/css/demo.css" rel="stylesheet" />

        <!--  Fonts and icons     -->
        <link
            href="http://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css"
            rel="stylesheet"
            />
        <link
            href="https://fonts.googleapis.com/css?family=Muli:400,300"
            rel="stylesheet"
            type="text/css"
            />
        <link href="assets/css/themify-icons.css" rel="stylesheet" />
    </h:head>
    <body>
         <div class="wrapper">
            <ui:include  src="AuthLayout/sidebar.xhtml"/>

            <div class="main-panel">
                <nav class="navbar navbar-default">
                    <div class="container-fluid">
                        <div class="navbar-header">
                            <button type="button" class="navbar-toggle">
                                <span class="sr-only">Toggle navigation</span>
                                <span class="icon-bar bar1"></span>
                                <span class="icon-bar bar2"></span>
                                <span class="icon-bar bar3"></span>
                            </button>
                            <a class="navbar-brand" href="#">Dashboard</a>
                        </div>
                        <div class="collapse navbar-collapse">
                        </div>
                    </div>
                </nav>
                <div class="content">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-lg-12 col-md-12">
                                <div class="card">
                                    <div class="header">
                                        <h4 class="title">Create New Blog</h4>
                                    </div>
                                    <c:if test="#{blogMB.mess.isMsg}">
                                                    <div class="">
                                                        <c:if test="#{blogMB.mess.code == '1'}">
                                                            <div class="alert alert-success" role="alert">
                                                                #{blogMB.mess.msg}
                                                            </div>
                                                        </c:if>
                                                        <c:if test="#{blogMB.mess.code == '2'}">
                                                            <div class="alert alert-warning" role="alert">
                                                                #{blogMB.mess.msg}
                                                            </div>
                                                        </c:if>
                                                        <c:if test="#{blogMB.mess.code == '3'}">
                                                            <div class="alert alert-danger" role="alert">
                                                                #{blogMB.mess.msg}
                                                            </div>
                                                        </c:if>
                                                    </div>
                                                </c:if>
                                    <div class="content">
                                        <h:form   enctype="multipart/form-data">
                                            
                                            <div class="row">
                                                
                                                <div class="col-md-4">
                                                    <div class="form-group">
                                                        <label>Thumbnail</label>
                                                        <h:inputFile  value="#{blogMB.file}" styleClass="form-control border-input" a:placeholder="Please Choosen Thumbnail" />
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-group">

                                                        <label>Title</label>
                                                        <h:inputText  value="#{blogMB.blog.title}"  styleClass="form-control border-input" a:placeholder="Please Enter Title" />
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-group">
                                                        <label>Topic</label>
                                                        <h:inputText  value="#{blogMB.blog.topic}"  styleClass="form-control border-input" a:placeholder="Please Enter Topic" />
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-md-12">
                                                    <div class="form-group">
                                                        <label>Content</label>
                                                        <h:inputTextarea styleClass="form-control border-input" value="#{blogMB.blog.content}"  a:row="5" a:placeholder="Please Enter Content"/>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="text-center">
                                                <h:panelGroup>
                                                    <h:commandButton action="#{blogMB.add(usersMB.iduser)}" value="Create New" type="submit" styleClass="btn btn-info btn-fill btn-wd"/>
                                                </h:panelGroup>
                                            </div>
                                            <div class="clearfix"></div>
                                        </h:form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <ui:include src="AuthLayout/footer.xhtml" />
            </div>
        </div>
    </body>
     <!--   Core JS Files   -->
    <script src="assets/js/jquery-1.10.2.js" type="text/javascript"></script>
    <script src="assets/js/bootstrap.min.js" type="text/javascript"></script>

    <!--  Checkbox, Radio & Switch Plugins -->
    <script src="assets/js/bootstrap-checkbox-radio.js"></script>

    <!--  Charts Plugin -->
    <script src="assets/js/chartist.min.js"></script>

    <!--  Notifications Plugin    -->
    <script src="assets/js/bootstrap-notify.js"></script>

    <!--  Google Maps Plugin    -->
    <script
        type="text/javascript"
        src="https://maps.googleapis.com/maps/api/js"
    ></script>

    <!-- Paper Dashboard Core javascript and methods for Demo purpose -->
    <script src="assets/js/paper-dashboard.js"></script>

    <!-- Paper Dashboard DEMO methods, don't include it in your project! -->
    <script src="assets/js/demo.js"></script>

    <script type="text/javascript">
        $(document).ready(function () {
            demo.initChartist();

            $.notify(
                    {
                        icon: "ti-gift",
                        message: "Welcome to <b>Wiska Dashboard</b>",
                    },
                    {
                        type: "success",
                        timer: 4000,
                    }
            );
        });
    </script>
</html>
