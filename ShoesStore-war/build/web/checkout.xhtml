<?xml version="1.0" encoding="UTF-8"?>


<!DOCTYPE html>
<html lang="zxx" class="no-js" xmlns="http://www.w3.org/1999/xhtml"  xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:a="http://xmlns.jcp.org/jsf/passthrough">

    <h:head>
        <!-- Mobile Specific Meta -->
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <!-- Favicon-->
        <!--<link rel="shortcut icon" href="assets/img/fav.png"/>-->
        <!-- Author Meta -->
        <meta name="author" content="CodePixar"/>
        <!-- Meta Description -->
        <meta name="description" content=""/>
        <!-- Meta Keyword -->
        <meta name="keywords" content=""/>
        <!-- meta character set -->
        <meta charset="UTF-8"/>
        <!-- Site Title -->
        <title>Wiska Store | Checkout</title>

        <!--
                CSS
                ============================================= -->
        <link rel="stylesheet" href="assets/css/linearicons.css"/>
        <link rel="stylesheet" href="assets/css/owl.carousel.css"/>
        <link rel="stylesheet" href="assets/css/themify-icons.css"/>
        <link rel="stylesheet" href="assets/css/font-awesome.min.css"/>
        <link rel="stylesheet" href="assets/css/nice-select.css"/>
        <link rel="stylesheet" href="assets/css/nouislider.min.css"/>
        <link rel="stylesheet" href="assets/css/bootstrap.css"/>
        <link rel="stylesheet" href="assets/css/main.css"/>
    </h:head>

    <body>

        <!-- Start Header Area -->
        <ui:include src="Layout/header.xhtml"/>
        <!-- End Header Area -->

        <!-- Start Banner Area -->
        <section class="banner-area organic-breadcrumb">
            <div class="container">
                <div class="breadcrumb-banner d-flex flex-wrap align-items-center justify-content-end">
                    <div class="col-first">
                        <h1>Checkout</h1>
                        <nav class="d-flex align-items-center">
                            <a href="index.html">Home<span class="lnr lnr-arrow-right"></span></a>
                            <a href="single-product.html">Checkout</a>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
        <!-- End Banner Area -->
 <h:form>
        <!--================Checkout Area =================-->
        <section class="checkout_area section_gap">
            <div class="container">
               
                    <div class="billing_details">
                        <div class="row">
                            <div class="col-lg-8">
                                <h3>Billing Details</h3>
                                <div styleClass="row contact_form">
                                    <div class="col-md-12 form-group p_star">
                                        <h:inputText value="#{odersMB.firstname}" styleClass="form-control" id="first" a:placeholder="Please Enter Firstname" required='true'/>
                                    </div>
                                    <div class="col-md-12 form-group p_star">
                                        <h:inputText value="#{odersMB.lastname}" styleClass="form-control" id="last" a:placeholder="Please Enter Lastname" required='true'/>
                                    </div>
                                    <div class="col-md-12 form-group p_star">
                                        <h:inputText value="#{odersMB.order.phone}" a:type="tel"  styleClass="form-control" id="number" a:placeholder="Please Enter Phone" required='true'/>
                                    </div>
                                    <div class="col-md-12 form-group">
                                        <h:inputTextarea class="form-control"  id="message" rows="5"  a:placeholder="Please Enter Address" value="#{odersMB.order.address}" required='true'></h:inputTextarea>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="order_box">
                                    <h2>Your Order</h2>
                                    <ul class="list">
                                        <li><a href="#">Product <span>Total</span></a></li>
                                        <ui:repeat value="#{cartMB.cartItems}" var="cart" >
                                            <li><a href="#">#{cart.title} <span class="middle">x #{cart.quantity}</span> <span class="last">$#{cart.price}</span></a></li>
                                        </ui:repeat>
                                    </ul>
                                    <ul class="list list_2">
                                        <li><a href="#">Total <span>$#{cartMB.TotalCart()}</span></a></li>
                                    </ul>
                                    <h:commandButton action="#{odersMB.checkout(usersMB.iduser,cartMB.cartItems)}" value="Proceed to Paypal" styleClass="primary-btn"/>

                                </div>
                            </div>
                        </div>
                    </div>
            </div>
        </section>
        
         </h:form>
        <!--================End Checkout Area =================-->

        <!-- start footer Area -->
        <ui:include src="Layout/footer.xhtml"/>
        <!-- End footer Area -->


        <script src="assets/js/vendor/jquery-2.2.4.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.assets/js/1.11.0/umd/popper.min.js" integrity="sha384-b/U6ypiBEHpOf/4+1nzFpr53nxSS+GLCkfwBdFNTxtclqqenISfwAzpKaMNFNmj4"
        crossorigin="anonymous"></script>
        <script src="assets/js/vendor/bootstrap.min.js"></script>
        <script src="assets/js/jquery.ajaxchimp.min.js"></script>
        <script src="assets/js/jquery.nice-select.min.js"></script>
        <script src="assets/js/jquery.sticky.js"></script>
        <script src="assets/js/nouislider.min.js"></script>
        <script src="assets/js/jquery.magnific-popup.min.js"></script>
        <script src="assets/js/owl.carousel.min.js"></script>
        <!--gmaps Js-->
        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjCGmQ0Uq4exrzdcL6rvxywDDOvfAu6eE"></script>
        <script src="assets/js/gmaps.min.js"></script>
        <script src="assets/js/main.js"></script>
    </body>

</html>
