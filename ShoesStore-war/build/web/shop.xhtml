<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>
<html lang="zxx" class="no-js" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

    <h:head>
        <!-- Mobile Specific Meta -->
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <!-- Favicon-->
        <!--<link rel="shortcut icon" href="assets/assets/img/fav.png"/>-->
        <!-- Author Meta -->
        <meta name="author" content="CodePixar"/>
        <!-- Meta Description -->
        <meta name="description" content=""/>
        <!-- Meta Keyword -->
        <meta name="keywords" content=""/>
        <!-- Site Title -->
        <title>Wiska Store | Shoes </title>

        <!--
            CSS
            ============================================= -->
        <link rel="stylesheet" href="assets/css/linearicons.css"/>
        <link rel="stylesheet" href="assets/css/owl.carousel.css"/>
        <link rel="stylesheet" href="assets/css/font-awesome.min.css"/>
        <link rel="stylesheet" href="assets/css/themify-icons.css"/>
        <link rel="stylesheet" href="assets/css/nice-select.css"/>
        <link rel="stylesheet" href="assets/css/nouislider.min.css"/>
        <link rel="stylesheet" href="assets/css/bootstrap.css"/>
        <link rel="stylesheet" href="assets/css/main.css"/>
    </h:head>

    <body id="category">

        <!-- Start Header Area -->
        <ui:include src="Layout/header.xhtml" >
            <ui:param name="active" value="shop"/>
        </ui:include>
        <!-- End Header Area -->

        <!-- Start Banner Area -->
        <section class="banner-area organic-breadcrumb">
            <div class="container">
                <div class="breadcrumb-banner d-flex flex-wrap align-items-center justify-content-end">
                    <div class="col-first">
                        <h1>Shop Category page</h1>
                        <nav class="d-flex align-items-center">
                            <h:link outcome="index">Home<span class="lnr lnr-arrow-right"></span></h:link>
                            <a href="#">Shop</a>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
        <h:form>
            <!-- End Banner Area -->
            <div class="container">

                <div class="row">
                    <div class="col-xl-12 col-lg-12 col-md-4">

                        <!-- Start Best Seller -->
                        <section class="lattest-product-area pb-40 category-list">
                            <div class="row">
                                <ui:repeat value="#{productsMB.products}" var="product">
                                    <h:commandLink action="#{productsMB.findProductDetail(product.productId)}">
                                        <div class="col-lg-3 col-md-6">

                                            <div class="single-product">
                                                <img class="img-fluid" src="./resources/products/#{product.thumnail}" alt="#{product.thumnail}"/>
                                                <div class="product-details">
                                                    <h6>#{product.title}</h6>
                                                     <div class="price">
                                                         <h6>#{product.brandId.brandName}</h6>
                                                    </div>
                                                    <div class="price">
                                                        <h6>#{product.price}</h6>
                                                    </div>
                                                    <div class="prd-bottom">

                                                        <h:commandLink action="#{cartMB.addItem(product.productId,1,usersMB.iduser)}" styleClass="social-info">
                                                            <span class="ti-bag"></span>
                                                            <p class="hover-text">add to cart</p>
                                                        </h:commandLink>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </h:commandLink>
                                </ui:repeat>
                                <!-- single product -->
                            </div>
                        </section>
                        <!-- End Best Seller -->
                        <!-- Start Filter Bar -->
                        <div class="filter-bar d-flex flex-wrap align-items-center justify-content-center mb-5">
                            <div class="pagination">
                                <h:commandButton value="Previous" action="#{productsMB.previousPage()}" 
                                                 disabled="#{productsMB.pageNumber == 1}" styleClass="prev-arrow" style="padding: 5px 10px;
                                                 border-radius: 5px;
                                                 color: white;margin-right: 
                                                 20px;background: linear-gradient(90deg, #68373A 0%, #A15A46 100%);"/>
                                <h:outputText  value="Page #{productsMB.pageNumber} of #{productsMB.maxPage()}" styleClass="active" style="display: flex;align-items: center; color:#ffffff"/>
                                <h:commandButton value="Next" action="#{productsMB.nextPage()}" 
                                                 disabled="#{productsMB.pageNumber * productsMB.pageSize >= productsMB.totalProducts}" styleClass="next-arrow" style="padding: 5px 25px;
                                                 border-radius: 5px;
                                                 color: white;margin-left: 
                                                 20px;background: linear-gradient(90deg, #68373A 0%, #A15A46 100%);"/>
                            </div>
                        </div>
                        <!-- End Filter Bar -->

                    </div>
                </div>

            </div>

        </h:form>
        <!-- start footer Area -->
        <ui:include src="Layout/footer.xhtml">

        </ui:include>
        <!-- End footer Area -->






        <script src="assets/js/vendor/jquery-2.2.4.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.assets/js/1.11.0/umd/popper.min.js" integrity="sha384-b/U6ypiBEHpOf/4+1nzFpr53nxSS+GLCkfwBdFNTxtclqqenISfwAzpKaMNFNmj4"
        crossorigin="anonymous"></script>
        <script src="assets/js/vendor/bootstrap.min.js"></script>
        <script src="assets/js/jquery.ajaxchimp.min.js"></script>
        <script src="assets/js/jquery.nice-select.min.js"></script>
        <script src="assets/js/jquery.sticky.js"></script>
        <script src="assets/js/nouislider.min.js"></script>
        <script src="assets/js/jquery.magnific-popup.min.js"></script>
        <script src="assets/js/owl.carousel.min.js"></script>
        <!--gmaps Js-->
        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjCGmQ0Uq4exrzdcL6rvxywDDOvfAu6eE"></script>
        <script src="assets/js/gmaps.min.js"></script>
        <script src="assets/js/main.js"></script>
    </body>

</html>
