<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:a="http://xmlns.jcp.org/jsf/passthrough"  xmlns:f="http://xmlns.jcp.org/jsf/core"  
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <h:head>
        <meta charset="utf-8" />
        <link
            rel="apple-touch-icon"
            sizes="76x76"
            href="assets/img/apple-icon.png"
            />
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="assets/img/favicon.png"
            />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

        <title>Wiska</title>

        <meta
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
            name="viewport"
            />
        <meta name="viewport" content="width=device-width" />

        <!-- Bootstrap core CSS     -->
        <link href="assets/css/bootstrap.min.css" rel="stylesheet" />

        <!-- Animation library for notifications   -->
        <link href="assets/css/animate.min.css" rel="stylesheet" />

        <!--  Paper Dashboard core CSS    -->
        <link href="assets/css/paper-dashboard.css" rel="stylesheet" />

        <!--  CSS for Demo Purpose, don't include it in your project     -->
        <link href="assets/css/demo.css" rel="stylesheet" />

        <!--  Fonts and icons     -->
        <link
            href="http://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css"
            rel="stylesheet"
            />
        <link
            href="https://fonts.googleapis.com/css?family=Muli:400,300"
            rel="stylesheet"
            type="text/css"
            />
        <link href="assets/css/themify-icons.css" rel="stylesheet" />
    </h:head>
    <body>
        <div class="wrapper">
            <ui:include  src="AuthLayout/sidebar.xhtml"/>

            <div class="main-panel">
                <nav class="navbar navbar-default">
                    <div class="container-fluid">
                        <div class="navbar-header">
                            <button type="button" class="navbar-toggle">
                                <span class="sr-only">Toggle navigation</span>
                                <span class="icon-bar bar1"></span>
                                <span class="icon-bar bar2"></span>
                                <span class="icon-bar bar3"></span>
                            </button>
                            <a class="navbar-brand" href="#">Dashboard</a>
                        </div>
                        <div class="collapse navbar-collapse">
                        </div>
                    </div>
                </nav>

                <div class="content">
                    <div class="container-fluid">
                        <h:form>
                            <div class="row" style="margin-bottom: 20px;">
                                <div class="col-md-2">
                                    <h:link value="Create New" outcome="/Admin/create-blog"  styleClass="btn btn-primary" />
                                </div>
                                <div class="col-md-5">
                                    <div class="justify-content-between align-items-center" style="display: flex">
                                        <h:inputText value="#{searchMB.searchTitleBlog}"
                                                         styleClass="form-control border-input "
                                                         a:placeholder="Search ..."
                                            style="margin-right: 10px;border-radius: 50px">
                                            <f:ajax event="keyup" render="searchResults" listener="#{searchMB.searchListAllBlog}" />
                                            </h:inputText>
                                    </div>
                                </div>
                                
                            </div>
                        </h:form>
                        <div class="row">
                            
                            <div class="col-md-12">
                                <div class="card" style="overflow-x: scroll; width: auto">
                                    <div class="header">
                                        <h4 class="title">Blog List</h4>
                                    </div>
                                    <c:if test="#{blogMB.mess.isMsg}">
                                    <div class="">
                                        <c:if test="#{blogMB.mess.code == '1'}">
                                            <div class="alert alert-success" role="alert">
                                                #{blogMB.mess.msg}
                                            </div>
                                        </c:if>
                                        <c:if test="#{blogMB.mess.code == '2'}">
                                            <div class="alert alert-warning" role="alert">
                                                #{blogMB.mess.msg}
                                            </div>
                                        </c:if>
                                        <c:if test="#{blogMB.mess.code == '3'}">
                                            <div class="alert alert-danger" role="alert">
                                                #{blogMB.mess.msg}
                                            </div>
                                        </c:if>
                                    </div>
                                </c:if>
                                    <div class="content table-responsive table-full-width">
                                        <h:form id="searchResults">
                                            <h:dataTable id="resultsTable" value="#{searchMB.searchListAllBlog()}" var="item" styleClass = "table table-striped">

                                                <h:column>    				
                                                    <f:facet name = "header">ID</f:facet>    				
                                                        #{item.blogId}
                                                </h:column>

                                                <h:column>
                                                    <f:facet name = "header">Thumbnail</f:facet>
                                                    <img src="../resources/blogs/#{item.thumbnail}" alt="#{item.thumbnail}" style="height: 90px;width: 120px;border-radius: 10px"/>
                                                </h:column>

                                                <h:column>
                                                    <f:facet name = "header">Author</f:facet>
                                                        #{item.userId.username}
                                                </h:column>

                                                <h:column>
                                                    <f:facet name = "header">Title</f:facet>
                                                        #{item.title}
                                                </h:column>
                                                <h:column>
                                                    <f:facet name = "header">Topic</f:facet>
                                                        #{item.topic}
                                                </h:column>
                                                <h:column>
                                                    <f:facet name = "header">View</f:facet>
                                                        #{item.blogView}
                                                </h:column>
                                                <h:column>
                                                    <f:facet name = "header">Date</f:facet>
                                                        #{item.blogDate}
                                                </h:column>
                                                <h:column>
                                                    <f:facet name = "header">Content</f:facet>
                                                        #{item.content}
                                                </h:column>
                                                <h:column>
                                                    <f:facet name = "header">Action</f:facet>
                                                    <h:commandButton value="Edit" action="#{blogMB.findBlogforUpdate(item.blogId)}" styleClass="btn btn-info" style="margin-right: 10px"/>    
                                                    <h:commandButton value="Delete" action="#{blogMB.deleteBlog(item.blogId)}"  styleClass="btn btn-danger" />
                                                </h:column>
                                            </h:dataTable>
                                        </h:form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <ui:include src="AuthLayout/footer.xhtml" />
            </div>
        </div>
    </body>
     <!--   Core JS Files   -->
    <script src="assets/js/jquery-1.10.2.js" type="text/javascript"></script>
    <script src="assets/js/bootstrap.min.js" type="text/javascript"></script>

    <!--  Checkbox, Radio & Switch Plugins -->
    <script src="assets/js/bootstrap-checkbox-radio.js"></script>

    <!--  Charts Plugin -->
    <script src="assets/js/chartist.min.js"></script>

    <!--  Notifications Plugin    -->
    <script src="assets/js/bootstrap-notify.js"></script>

    <!--  Google Maps Plugin    -->
    <script
        type="text/javascript"
        src="https://maps.googleapis.com/maps/api/js"
    ></script>

    <!-- Paper Dashboard Core javascript and methods for Demo purpose -->
    <script src="assets/js/paper-dashboard.js"></script>

    <!-- Paper Dashboard DEMO methods, don't include it in your project! -->
    <script src="assets/js/demo.js"></script>

    <script type="text/javascript">
        $(document).ready(function () {
            demo.initChartist();

            $.notify(
                    {
                        icon: "ti-gift",
                        message: "Welcome to <b>Wiska Dashboard</b>",
                    },
                    {
                        type: "success",
                        timer: 4000,
                    }
            );
        });
    </script>
</html>
