<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <h:head>
        <meta charset="utf-8" />
        <link
            rel="apple-touch-icon"
            sizes="76x76"
            href="assets/img/apple-icon.png"
            />
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="assets/img/favicon.png"
            />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

        <title>Wiska</title>

        <meta
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
            name="viewport"
            />
        <meta name="viewport" content="width=device-width" />

        <!-- Bootstrap core CSS     -->
        <link href="assets/css/bootstrap.min.css" rel="stylesheet" />

        <!-- Animation library for notifications   -->
        <link href="assets/css/animate.min.css" rel="stylesheet" />

        <!--  Paper Dashboard core CSS    -->
        <link href="assets/css/paper-dashboard.css" rel="stylesheet" />

        <!--  CSS for Demo Purpose, don't include it in your project     -->
        <link href="assets/css/demo.css" rel="stylesheet" />

        <!--  Fonts and icons     -->
        <link
            href="http://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css"
            rel="stylesheet"
            />
        <link
            href="https://fonts.googleapis.com/css?family=Muli:400,300"
            rel="stylesheet"
            type="text/css"
            />
        <link href="assets/css/themify-icons.css" rel="stylesheet" />
    </h:head>
    <body>
        <div class="wrapper">
            <ui:include  src="AuthLayout/sidebar.xhtml"/>

            <div class="main-panel">
                <nav class="navbar navbar-default">
                    <div class="container-fluid">
                        <div class="navbar-header">
                            <button type="button" class="navbar-toggle">
                                <span class="sr-only">Toggle navigation</span>
                                <span class="icon-bar bar1"></span>
                                <span class="icon-bar bar2"></span>
                                <span class="icon-bar bar3"></span>
                            </button>
                            <a class="navbar-brand" href="#">Dashboard</a>
                        </div>
                        <div class="collapse navbar-collapse">
                        </div>
                    </div>
                </nav>

                <div class="content">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-lg-3 col-sm-6">
                                <div class="card">
                                    <div class="content">
                                        <div class="row">
                                            <div class="col-xs-5">
                                                <div class="icon-big iicon-danger text-center">
                                                    <i class="ti-archive"></i>
                                                </div>
                                            </div>
                                            <div class="col-xs-7">
                                                <div class="numbers">
                                                    <p>Products</p>
                                                    #{productsMB.productCount()}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3 col-sm-6">
                                <div class="card">
                                    <div class="content">
                                        <div class="row">
                                            <div class="col-xs-5">
                                                <div class="icon-big icon-success text-center">
                                                    <i class="ti-wallet"></i>
                                                </div>
                                            </div>
                                            <div class="col-xs-7">
                                                <div class="numbers">
                                                    <p>Revenue</p>
                                                    $#{odersMB.revenue()}
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3 col-sm-6">
                                <div class="card">
                                    <div class="content">
                                        <div class="row">
                                            <div class="col-xs-5">
                                                <div class="icon-big  icon-warning text-center">
                                                    <i class="ti-server"></i>
                                                </div>
                                            </div>
                                            <div class="col-xs-7">
                                                <div class="numbers">
                                                    <p>Administration</p>
                                                    #{usersMB.CountAdmins()}
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3 col-sm-6">
                                <div class="card">
                                    <div class="content">
                                        <div class="row">
                                            <div class="col-xs-5">
                                                <div class="icon-big icon-info text-center">
                                                    <i class="ti-user"></i>
                                                </div>
                                            </div>
                                            <div class="col-xs-7">
                                                <div class="numbers">
                                                    <p>Users</p>
                                                    #{usersMB.CountUsers()}
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                        <h:form>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card card-user" style="height: 445px">
                                        <div class="image">
                                            <img src="assets/img/background.jpg" alt="..." />
                                        </div>
                                        <div class="content">
                                            <div class="author">
                                                <img
                                                    class="avatar border-white"
                                                    src="../resources/users/#{usersMB.avtuser}"
                                                    alt="..."
                                                    style="margin-bottom: 20px"
                                                    />
                                                <h4 class="title" style="margin-bottom: 40px">
                                                    #{usersMB.loggedInUser}<br />
                                                </h4>
                                            </div>
                                            <hr />
                                            <p class="description text-center">#{usersMB.role}</p>
                                            <hr />
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="card" style="height: 445px">
                                        <div class="header">
                                            <h4 class="title">Administration Members</h4>
                                        </div>
                                        <div class="content">
                                            <ul class="list-unstyled team-members">
                                                <c:forEach var="item" items="#{usersMB.ListAdministration()}">
                                                    <li>
                                                        <div class="row">
                                                            <div class="col-xs-3">
                                                                <div class="avatar">
                                                                    <img
                                                                        src="../resources/users/#{item.avartar}"
                                                                        alt="Circle Image"
                                                                        class="img-circle img-no-padding img-responsive"
                                                                        />
                                                                </div>
                                                            </div>
                                                            <div class="col-xs-6">
                                                                #{item.username}
                                                                <br />
                                                                <span class="text-danger"><small>#{item.email}</small></span>
                                                            </div>

                                                            <div class="col-xs-3">
                                                                #{item.role}
                                                            </div>
                                                        </div>
                                                    </li>
                                                </c:forEach>
                                            </ul>
                                        </div>

                                    </div>
                                </div>

                            </div>
                        </h:form>
                    </div>
                </div>
                <ui:include src="AuthLayout/footer.xhtml" />
            </div>
        </div>
       
    </body>

    <!--   Core JS Files   -->
    <script src="assets/js/jquery-1.10.2.js" type="text/javascript"></script>
    <script src="assets/js/bootstrap.min.js" type="text/javascript"></script>

    <!--  Checkbox, Radio & Switch Plugins -->
    <script src="assets/js/bootstrap-checkbox-radio.js"></script>

    <!--  Charts Plugin -->
    <script src="assets/js/chartist.min.js"></script>

    <!--  Notifications Plugin    -->
    <script src="assets/js/bootstrap-notify.js"></script>

    <!--  Google Maps Plugin    -->
    <script
        type="text/javascript"
        src="https://maps.googleapis.com/maps/api/js"
    ></script>

    <!-- Paper Dashboard Core javascript and methods for Demo purpose -->
    <script src="assets/js/paper-dashboard.js"></script>

    <!-- Paper Dashboard DEMO methods, don't include it in your project! -->
    <script src="assets/js/demo.js"></script>

    <script type="text/javascript">
        $(document).ready(function () {
            demo.initChartist();

            $.notify(
                    {
                        icon: "ti-gift",
                        message: "Welcome to <b>Wiska Dashboard</b>",
                    },
                    {
                        type: "success",
                        timer: 4000,
                    }
            );
        });
    </script>
</html>
