<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="zxx" class="no-js" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:a="http://xmlns.jcp.org/jsf/passthrough"  xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <h:head>
    <!-- Mobile Specific Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <!-- Favicon-->
<!--    <link rel="shortcut icon" href="assets/assets/img/fav.png"/>-->
    <!-- Author Meta -->
    <meta name="author" content="CodePixar"/>
    <!-- Meta Description -->
    <meta name="description" content=""/>
    <!-- Meta Keyword -->
    <meta name="keywords" content=""/>
    <!-- Site Title -->
     <title>Wiska Store | Blog</title>

    <!--
            CSS
            ============================================= -->
    <link rel="stylesheet" href="assets/css/linearicons.css"/>
    <link rel="stylesheet" href="assets/css/owl.carousel.css"/>
    <link rel="stylesheet" href="assets/css/themify-icons.css"/>
    <link rel="stylesheet" href="assets/css/font-awesome.min.css"/>
    <link rel="stylesheet" href="assets/css/nice-select.css"/>
    <link rel="stylesheet" href="assets/css/nouislider.min.css"/>
    <link rel="stylesheet" href="assets/css/bootstrap.css"/>
    <link rel="stylesheet" href="assets/css/main.css"/>
</h:head>
    <body>
        
        
        <!-- Start Header Area -->
	   <ui:include src="Layout/header.xhtml" />
	<!-- End Header Area -->
        
        
        <!-- Start Banner Area -->
    <section class="banner-area organic-breadcrumb">
      <div class="container">
        <div
          class="breadcrumb-banner d-flex flex-wrap align-items-center justify-content-end"
        >
          <div class="col-first">
            <h1>Blog Page</h1>
            <nav class="d-flex align-items-center">
              <h:link outcome="index">Home<span class="lnr lnr-arrow-right"></span></h:link>
              <a href="#">Blog</a>
            </nav>
          </div>
        </div>
      </div>
    </section>
    <!-- End Banner Area -->

  
    <!--================Blog Area =================-->
    <section class="blog_area mt-5">
      <div class="container">
          <h:form>
        <div class="row">
          <div class="col-lg-12">
            <div class="blog_left_sidebar">
                <c:forEach var="item" items="#{blogMB.ListAll()}">
                    <article class="row blog_item">
                <div class="col-md-3">
                  <div class="blog_info text-right">
                    <div class="post_tag">
                        <a class="active" href="#">#{item.topic}</a>
                    </div>
                    <ul class="blog_meta list">
                      <li>
                          <a href="#">#{item.userId.username}<i class="lnr lnr-user"></i></a>
                      </li>
                      <li>
                        <a href="#"
                           >#{item.blogDate}<i class="lnr lnr-calendar-full"></i
                        ></a>
                      </li>
                      <li>
                          <a href="#">#{item.blogView} Views<i class="lnr lnr-eye"></i></a>
                      </li>
                    </ul>
                  </div>
                </div>
                <div class="col-md-9">
                  <div class="blog_post">
                      <img src="./resources/blogs/#{item.thumbnail}" alt="#{item.thumbnail}" />
                    <div class="blog_details">
                        <h:commandLink action="#{blogMB.detailAndIncrease(item.blogId)}">
                          <h2>#{item.title}</h2>
                      </h:commandLink>
                      <p>
                        #{item.content}
                      </p>
                        <h:commandLink action="#{blogMB.detailAndIncrease(item.blogId)}" styleClass="white_bg_btn"
                                       >View More</h:commandLink>
                      
                    </div>
                  </div>
                </div>
              </article>
             </c:forEach>
              
            
            </div>
          </div>
        </div>
       </h:form>
      </div>
    </section>
    <!--================Blog Area =================-->
    
   <!-- start footer Area -->
        <ui:include src="Layout/footer.xhtml"/>
        <!-- End footer Area -->


        <script src="assets/js/vendor/jquery-2.2.4.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.assets/js/1.11.0/umd/popper.min.js" integrity="sha384-b/U6ypiBEHpOf/4+1nzFpr53nxSS+GLCkfwBdFNTxtclqqenISfwAzpKaMNFNmj4"
        crossorigin="anonymous"></script>
        <script src="assets/js/vendor/bootstrap.min.js"></script>
        <script src="assets/js/jquery.ajaxchimp.min.js"></script>
        <script src="assets/js/jquery.nice-select.min.js"></script>
        <script src="assets/js/jquery.sticky.js"></script>
        <script src="assets/js/nouislider.min.js"></script>
        <script src="assets/js/jquery.magnific-popup.min.js"></script>
        <script src="assets/js/owl.carousel.min.js"></script>
        <!--gmaps Js-->
        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjCGmQ0Uq4exrzdcL6rvxywDDOvfAu6eE"></script>
        <script src="assets/js/gmaps.min.js"></script>
        <script src="assets/js/main.js"></script>
    
    </body>
</html>
